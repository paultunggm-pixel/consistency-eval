name: 部署 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'polymarket_report.html'
      - 'worldcup-site-audit.html'
      - 'cover-tool/**'
      - 'qianwen-lecture/**'
      - 'qwen-lecture-platform/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ====== 双通道：同步 cover-tool 到阿里云 OSS ======
  # 说明：workflow 触发（on.push.paths）已保证只有 cover-tool/ 变更时运行
  sync-oss:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install oss2
        run: pip install oss2

      - name: Sync cover-tool to Alibaba Cloud OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: python3 scripts/sync-cover-tool-to-oss.py
